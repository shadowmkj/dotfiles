set -g default-terminal "tmux-256color"

set -g prefix C-Space
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
set -g window-size latest
# Enable escape sequence passthrough for tmux 3.3a+
set -gq allow-passthrough on
set -g visual-activity off
set-option -g focus-events on

# Explicitly propagate environment variables Yazi uses for capability detection
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Force terminal capabilities for iTerm/WezTerm inline images
set -as terminal-features ',xterm-256color:clipboard:ccolour:cstyle:focus:title'
set -as terminal-overrides ',xterm*:sitm=\E[3m'

unbind C-b
bind-key C-Space send-prefix

unbind %
bind | split-window -h
unbind '"'
bind - split-window -v

bind j resize-pane -D 5
bind k resize-pane -U 5
bind l resize-pane -R 5
bind h resize-pane -L 5
bind -n C-S-l resize-pane -R 5
bind -n C-S-h resize-pane -L 5

bind -r m resize-pane -Z
bind -n C-S-z resize-pane -Z

bind-key -n C-M-S-j resize-pane -Z

set -g mouse on

set-window-option -g mode-keys vi
set-option -g automatic-rename on
set-option -g default-shell /opt/homebrew/bin/fish


bind-key -n C-M-S-k new-window

# Quick Switch
bind-key -n C-M-S-0 select-window -t :0
bind-key -n C-M-S-1 select-window -t :1
bind-key -n C-M-S-2 select-window -t :2
bind-key -n C-M-S-3 select-window -t :3
bind-key -n C-M-S-4 select-window -t :4
bind-key -n C-M-S-5 select-window -t :5
bind-key -n C-M-S-6 select-window -t :6
bind-key -n C-M-S-7 select-window -t :7
bind-key -n C-M-S-8 select-window -t :8
bind-key -n C-M-S-9 select-window -t :9

bind-key -n C-M-S-h previous-window
bind-key -n C-M-S-l next-window

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse

##### Display Popups #####

bind -n C-S-g display-popup \
  -d "#{pane_current_path}" \
  -w 80% \
  -h 80% \
  -E "lazygit"
bind -n C-S-s display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"
bind -n C-S-j display-popup \
  -w 90% \
  -h 90% \
  -E "yazi"
bind -n C-S-a display-popup -w 75% -h 75% -E "~/.config/custom/gemgo-tmux/gemgo.sh"

# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 10

bind-key x kill-pane # kill pane with "x"
bind-key -n C-M-S-m kill-pane # kill pane with "Hyper-m"


bind i new-window -n "Cheat" '~/.config/custom/cheat.sh; nu'

set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'rose-pine/tmux'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'MunifTanjim/tmux-mode-indicator'
set -g @plugin 'tmux-plugins/tmux-open'

# set -g status-left "#[bold,fg=green][#S] #[default]"
# set -g status-left-length 50

# set -g @ukiyo-theme "gruvbox/dark"    # Dark
# set -g @ukiyo-ignore-window-colors true
# set -g @ukiyo-plugins "battery network-bandwidth"
set -g status-left "#[reverse,bold] #S #[noreverse]"
set -g window-status-format " #I #W "
set -g window-status-current-format "#[reverse] #I #W #[noreverse]"
set -g window-status-separator " | "

# Global status bar transparency setting ('on' or 'off')
set -g @transparency "on"

# Toggle status bar transparency with Prefix + T
bind-key T run-shell "~/.tmux/scripts/toggle_transparency.sh toggle"

run '~/.tmux/plugins/tpm/tpm'

# Tinty colors (sourced after TPM to ensure overrides take effect)
if-shell 'test -f ~/.tmux/tinty-colors.conf' 'source-file ~/.tmux/tinty-colors.conf'

# Global transparency manager (applies transparency state over active theme)
run-shell "~/.tmux/scripts/toggle_transparency.sh apply"


